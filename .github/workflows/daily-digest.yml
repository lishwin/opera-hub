name: 每日歌剧动态

on:
  schedule:
    # 每天 09:00（北京时间 = 01:00 UTC），如需调整时间改这里
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: opera-hub-daily
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖与浏览器
        run: |
          pip install -r requirements-browser.txt
          python -m playwright install --with-deps chromium || echo "浏览器安装失败，将跳过需要浏览器的数据源"
        continue-on-error: true

      - name: 采集并生成日报
        env:
          OP_HUB_ENABLE_BROWSER: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: python src/run_daily.py

      - name: 提交数据更新
        run: |
          git config user.name "opera-hub[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "chore: 每日数据更新 $(date -u +%Y-%m-%d)"
            git push
          fi
